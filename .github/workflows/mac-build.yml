# macOS kurulum dosyası (DMG) — Mac'e ihtiyaç duymadan GitHub'ın Mac sunucusunda derlenir.
# Çalıştırma: GitHub → Actions → "macOS DMG" → Run workflow. Bitince "Artifacts" altından DMG indirilir.
# İmzasızdır: Mac'te ilk açılışta sağ tık → Aç gerekir (bkz. docs/MAC-KURULUM.md).
name: macOS DMG

on:
  workflow_dispatch:

jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --mac dmg --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: UcaMedyaAI-mac
          path: release/*.dmg
          retention-days: 14
